<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WOYZ Activity Log</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Inter:wght@500;600;700;800&family=IBM+Plex+Mono:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1E2924;
    --muted:#707B75;
    --teal:#1F6B59;
    --teal-dark:#155446;
    --teal-wash:#EAF5F1;
    --red:#E44734;
    --red-wash:#FDEBE7;
    --border:#D9E4DF;
    --paper:#F6F8F6;
    --shadow:0 24px 60px -38px rgba(20,35,29,.5);
  }
  *{ box-sizing:border-box; }
  body{
    margin:0;
    min-height:100vh;
    color:var(--ink);
    background:var(--paper);
    font-family:'Inter',system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  }
  button,input{ font:inherit; }
  .login-screen{ min-height:100vh; display:flex; align-items:center; justify-content:center; padding:28px; background:linear-gradient(145deg,#F4F5F3,#EAF2EF); }
  .login-screen.hidden{ display:none; }
  .login-card{ width:min(420px,100%); background:#fff; border:1px solid var(--border); border-radius:22px; padding:34px; box-shadow:var(--shadow); }
  .brand{ display:flex; align-items:center; justify-content:center; gap:10px; margin-bottom:27px; font-size:27px; font-weight:800; }
  .brand-pill{ display:inline-flex; align-items:center; gap:9px; padding:8px 16px 8px 10px; border:4px solid #F45155; border-radius:999px; background:#17171D; color:#fff; letter-spacing:1px; }
  .brand-dot{ width:27px; height:27px; border-radius:50%; background:#F45155; border:7px solid #452126; }
  h1{ margin:0; font:700 28px/1.1 'Fraunces',serif; }
  .sub{ margin:8px 0 23px; color:var(--muted); font-size:13px; }
  label{ display:block; margin:14px 0 7px; font-size:12px; font-weight:800; color:var(--muted); text-transform:uppercase; letter-spacing:.05em; }
  input{ width:100%; height:44px; border:1.5px solid var(--border); border-radius:11px; padding:0 13px; outline:none; background:#fff; color:var(--ink); }
  input:focus{ border-color:#8FB9AC; box-shadow:0 0 0 3px rgba(143,185,172,.2); }
  .btn{ min-height:44px; border:1.5px solid var(--border); border-radius:11px; background:#fff; color:var(--ink); padding:0 18px; font-weight:800; cursor:pointer; }
  .btn.primary{ width:100%; margin-top:22px; background:var(--teal); border-color:var(--teal); color:#fff; }
  .btn.primary:hover{ background:var(--teal-dark); }
  .btn.ghost:hover{ background:var(--teal-wash); border-color:#BBD2CA; color:var(--teal-dark); }
  .error{ min-height:18px; margin-top:12px; color:var(--red); font-size:12px; }
  .app{ display:none; min-height:100vh; }
  .app.authenticated{ display:grid; grid-template-columns:340px minmax(0,1fr); }
  .sidebar{ background:#fff; border-right:1px solid var(--border); padding:26px 22px; display:flex; flex-direction:column; gap:20px; min-height:100vh; }
  .sidebar .brand{ justify-content:flex-start; margin-bottom:10px; }
  .sidebar .brand-pill{ font-size:24px; }
  .search{ display:grid; gap:12px; }
  .filters{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .meta{ color:var(--muted); font:700 12px 'IBM Plex Mono',monospace; text-transform:uppercase; letter-spacing:.04em; }
  .content{ min-width:0; display:flex; flex-direction:column; min-height:100vh; }
  .topbar{ min-height:82px; background:#fff; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; gap:16px; padding:18px 28px; position:sticky; top:0; z-index:4; }
  .topbar-actions{ display:flex; gap:10px; align-items:center; flex-wrap:wrap; justify-content:flex-end; }
  .log-list{ padding:28px; display:grid; gap:12px; }
  .log-item{ background:#fff; border:1px solid var(--border); border-radius:12px; padding:16px 18px; box-shadow:0 14px 34px -32px rgba(20,35,29,.45); display:grid; gap:8px; }
  .log-head{ display:flex; align-items:flex-start; justify-content:space-between; gap:16px; }
  .action{ font-size:16px; font-weight:800; }
  .time{ color:var(--muted); font:700 12px 'IBM Plex Mono',monospace; white-space:nowrap; }
  .details{ display:flex; gap:8px; flex-wrap:wrap; }
  .chip{ min-height:25px; display:inline-flex; align-items:center; border-radius:999px; padding:0 9px; background:#F2F6F4; color:#496158; font-size:12px; font-weight:800; }
  .chip.red{ background:var(--red-wash); color:var(--red); }
  .empty{ margin:30px; padding:28px; background:#fff; border:1px dashed var(--border); border-radius:14px; color:var(--muted); font-weight:700; text-align:center; }
  @media (max-width:850px){
    .app.authenticated{ grid-template-columns:1fr; }
    .sidebar{ min-height:auto; border-right:0; border-bottom:1px solid var(--border); }
    .topbar{ position:static; align-items:flex-start; flex-direction:column; }
    .log-list{ padding:18px; }
    .log-head{ flex-direction:column; gap:6px; }
  }
</style>
</head>
<body>
<section class="login-screen" id="loginScreen">
  <form class="login-card" id="loginForm">
    <div class="brand"><span class="brand-pill"><span class="brand-dot"></span>WOYZ</span><span>Log</span></div>
    <h1>Activity log</h1>
    <p class="sub">Master admin access only.</p>
    <label for="loginEmail">Email address</label>
    <input id="loginEmail" type="email" autocomplete="username" required>
    <label for="loginPassword">Password</label>
    <input id="loginPassword" type="password" autocomplete="current-password" required>
    <button class="btn primary" id="loginSubmit" type="submit">Sign in</button>
    <div class="error" id="loginError" role="alert"></div>
  </form>
</section>

<div class="app" id="appShell">
  <aside class="sidebar">
    <div class="brand"><span class="brand-pill"><span class="brand-dot"></span>WOYZ</span><span>Log</span></div>
    <div class="search">
      <input id="searchInput" type="search" autocomplete="off" placeholder="Search user, action, patient, UHID">
      <div class="filters">
        <input id="dateInput" type="date" aria-label="Filter by date">
        <button class="btn ghost" id="clearBtn" type="button">Clear</button>
      </div>
      <div class="meta" id="logCount">0 activities</div>
    </div>
  </aside>
  <main class="content">
    <header class="topbar">
      <div>
        <h1>Activity log</h1>
        <p class="sub" id="userEmail"></p>
      </div>
      <div class="topbar-actions">
        <button class="btn ghost" id="refreshBtn" type="button">Refresh</button>
        <button class="btn ghost" id="signoutBtn" type="button">Sign out</button>
      </div>
    </header>
    <section class="log-list" id="logList"></section>
  </main>
</div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js';
import { browserLocalPersistence, getAuth, onAuthStateChanged, setPersistence, signInWithEmailAndPassword, signOut } from 'https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js';
import { getFirestore, collection, limit, onSnapshot, orderBy, query } from 'https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js';
import { firebaseConfig } from './firebase-config.js';

const MASTER_ADMIN_UID = 'kzlnh5rBzpTlYEqF7Ou35F1YWaa2';
const MASTER_ADMIN_EMAIL = 'drgigy@gmail.com';

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
setPersistence(auth, browserLocalPersistence).catch(error => console.warn('Unable to enable persistent login:', error));

const loginScreen = document.getElementById('loginScreen');
const loginForm = document.getElementById('loginForm');
const loginEmail = document.getElementById('loginEmail');
const loginPassword = document.getElementById('loginPassword');
const loginSubmit = document.getElementById('loginSubmit');
const loginError = document.getElementById('loginError');
const appShell = document.getElementById('appShell');
const userEmail = document.getElementById('userEmail');
const searchInput = document.getElementById('searchInput');
const dateInput = document.getElementById('dateInput');
const clearBtn = document.getElementById('clearBtn');
const refreshBtn = document.getElementById('refreshBtn');
const signoutBtn = document.getElementById('signoutBtn');
const logCount = document.getElementById('logCount');
const logList = document.getElementById('logList');

let unsubscribeLogs = null;
let logs = [];
let searchTerm = '';
let selectedDate = '';

function escapeHtml(value){
  return String(value ?? '').replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[char]));
}

function titleCaseAction(action){
  return String(action || 'activity')
    .replace(/[_-]+/g, ' ')
    .replace(/\b\w/g, char => char.toUpperCase());
}

function timestampDate(value){
  const date = value?.toDate?.() || null;
  if (!date) return '';
  return date.toLocaleString('en-IN', {
    day:'2-digit',
    month:'2-digit',
    year:'numeric',
    hour:'2-digit',
    minute:'2-digit',
    hour12:true
  });
}

function dateKey(value){
  const date = value?.toDate?.() || null;
  if (!date) return '';
  const year = date.getFullYear();
  const month = String(date.getMonth() + 1).padStart(2, '0');
  const day = String(date.getDate()).padStart(2, '0');
  return `${year}-${month}-${day}`;
}

function chip(label, value, tone = ''){
  const text = String(value || '').trim();
  if (!text) return '';
  return `<span class="chip ${tone}">${escapeHtml(label)}: ${escapeHtml(text)}</span>`;
}

function logHaystack(log){
  return [
    log.action,
    log.page,
    log.email,
    log.userId,
    log.noteId,
    log.noteOwnerUid,
    log.noteType,
    log.patientName,
    log.uhid,
    log.visitDate,
    log.visitType
  ].filter(Boolean).join(' ').toLowerCase();
}

function filteredLogs(){
  const term = searchTerm.trim().toLowerCase();
  return logs.filter(log => {
    if (selectedDate && dateKey(log.createdAt) !== selectedDate) return false;
    if (term && !logHaystack(log).includes(term)) return false;
    return true;
  });
}

function render(){
  const visible = filteredLogs();
  logCount.textContent = `${visible.length} ${visible.length === 1 ? 'activity' : 'activities'}`;
  if (!visible.length){
    logList.innerHTML = '<div class="empty">No activities found.</div>';
    return;
  }
  logList.innerHTML = visible.map(log => `
    <article class="log-item">
      <div class="log-head">
        <div class="action">${escapeHtml(titleCaseAction(log.action))}</div>
        <div class="time">${escapeHtml(timestampDate(log.createdAt) || 'Pending time')}</div>
      </div>
      <div class="details">
        ${chip('Page', log.page)}
        ${chip('User', log.email || log.userId)}
        ${chip('Patient', log.patientName)}
        ${chip('UHID', log.uhid)}
        ${chip('Type', log.noteType)}
        ${chip('Visit date', log.visitDate)}
        ${chip('Visit type', log.visitType)}
        ${chip('Owner', log.noteOwnerUid)}
        ${chip('Note', log.noteId)}
      </div>
    </article>
  `).join('');
}

function subscribeLogs(){
  if (unsubscribeLogs) unsubscribeLogs();
  const logsQuery = query(collection(db, 'activityLogs'), orderBy('createdAt', 'desc'), limit(500));
  unsubscribeLogs = onSnapshot(logsQuery, snapshot => {
    logs = snapshot.docs.map(doc => ({id:doc.id, ...doc.data()}));
    render();
  }, error => {
    console.error(error);
    logList.innerHTML = `<div class="empty">${escapeHtml(error.message || 'Unable to load activity logs.')}</div>`;
  });
}

loginForm.addEventListener('submit', async event => {
  event.preventDefault();
  loginError.textContent = '';
  loginSubmit.disabled = true;
  loginSubmit.textContent = 'Signing in...';
  try{
    await signInWithEmailAndPassword(auth, loginEmail.value.trim(), loginPassword.value);
    loginPassword.value = '';
  }catch(error){
    loginError.textContent = 'Unable to sign in. Check the email and password.';
  }finally{
    loginSubmit.disabled = false;
    loginSubmit.textContent = 'Sign in';
  }
});

onAuthStateChanged(auth, user => {
  if (unsubscribeLogs) unsubscribeLogs();
  unsubscribeLogs = null;
  logs = [];
  render();
  if (!user){
    appShell.classList.remove('authenticated');
    loginScreen.classList.remove('hidden');
    userEmail.textContent = '';
    return;
  }
  const email = String(user.email || '').toLowerCase();
  if (user.uid !== MASTER_ADMIN_UID && email !== MASTER_ADMIN_EMAIL){
    signOut(auth).catch(() => {});
    appShell.classList.remove('authenticated');
    loginScreen.classList.remove('hidden');
    loginError.textContent = 'This account is not authorized for the activity log.';
    return;
  }
  loginScreen.classList.add('hidden');
  appShell.classList.add('authenticated');
  userEmail.textContent = user.email || '';
  subscribeLogs();
});

searchInput.addEventListener('input', () => {
  searchTerm = searchInput.value || '';
  render();
});
dateInput.addEventListener('input', () => {
  selectedDate = dateInput.value || '';
  render();
});
clearBtn.addEventListener('click', () => {
  searchInput.value = '';
  dateInput.value = '';
  searchTerm = '';
  selectedDate = '';
  render();
});
refreshBtn.addEventListener('click', subscribeLogs);
signoutBtn.addEventListener('click', () => signOut(auth));
</script>
</body>
</html>
